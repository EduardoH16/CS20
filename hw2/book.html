<!DOCTYPE html>
<html>
    <head>
        <title>Book | ChessCoaches</title>
        <style type="text/css">
            body {
                background-color: #e7e2d6;
                margin: 0;
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }

            header {
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
                padding: 20px 25px;
                border-bottom: 6px solid #6b4423;
            }

            h1 {
                color: #2E6F40;
                margin: 0;
                justify-self: start;
            }

            h2 {
                color: #2E6F40;
                margin: 40px;
                font-size: 60px;
            }

            #logo {
                justify-self: end;
                width: 60px;
                height: auto;
            }

            #imgbackground {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                z-index: -1;
            }

            ul#nav {
                list-style-type: none;
                font-size: 22px;
                text-align: center;
                padding: 0;
                margin: 0;
            }

            ul#nav a {
                text-decoration: none;
                color: #2E6F40;
                width: 150px;
                text-align: center;
                display: inline-block;
            }

            ul#nav a:hover {
                color: #fff;
                background-color: #2E6F40;
            }

            ul#nav li {
                display: inline-block;
            }

            footer {
                background-color: #6b4423;
                color: #e7e2d6;
                text-align: center;
                padding: 20px 0;
                margin-top: auto;
                width: 100%;
            }

            @media (max-width: 900px) {
                header {
                    grid-template-columns: 1fr;
                    justify-items: center;
                    gap: 10px;
                }
                h1, #logo {
                    justify-self: center;
                }
            }

            @media (max-width: 650px) {
                ul#nav a {
                    width: 100px;
                }
            }

            @media (max-width: 400px) {
                ul#nav a {
                    padding: 2px 5px;
                    font-size: 15px;
                }
            }
        </style>
    </head>
    <body>
        <img id="imgbackground" src="chessboardbackground.png" alt="">

        <header>
            <h1>ChessCoaches</h1>
            <ul id="nav">
                <li><a href="index.html">Home</a></li>
                <li><a href="coaches.html">Coaches</a></li>
                <li><a href="book.html">Book</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <img id="logo" src="greenpawntransp.png" alt="green pawn">
        </header>

        <h2>Book a Coaching Session.</h2>
        <form action="#">
            <p>Choose a coach:</p>
            <input type="radio" id="magnus" name="coach" value="magnus" required>
            <label for="magnus">Magnus Carlsen</label><br>
            <input type="radio" id="hikaru" name="coach" value="hikaru">
            <label for="hikaru">Hikaru Nakamura</label><br><br>

            <label for="hours">Number of hours:</label>
            <input type="number" id="hours" name="hours" min="1" required><br><br>

            <input type="submit" value="Book">
        </form>

        <footer>ChessCoaches</footer>
    </body>
</html>
